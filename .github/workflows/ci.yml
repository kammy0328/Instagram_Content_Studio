name: CI

on:
  push:
    branches: [main, "review/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System packages (FFmpeg, Qt offscreen 의존 라이브러리)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-noto-cjk
          ffmpeg -hide_banner -encoders | grep -E "libx264|prores_ks|aac"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker(클라우드 중계) 테스트
        run: cd worker && npm test
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests
        run: python -m pytest tests
